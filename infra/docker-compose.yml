# FoodMe local / CI stack.
#
#   docker compose -f infra/docker-compose.yml --profile core up -d --build
#
# Profile "core": Postgres + the backend on http://localhost:8081. The backend
# image also serves the storefront at / and the admin at /backoffice; the e2e
# suite starts its own Vite dev server (see apps/web/playwright.config.ts).
# Values come from the repo-root .env (copy .env.example).

name: foodme

services:
  postgres:
    profiles: ["core"]
    image: postgres:16-alpine
    env_file: ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    profiles: ["core"]
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    env_file: ../.env
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
